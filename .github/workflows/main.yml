name: Send weekly literature brief
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate a preview without email or advancing delivery coverage
        type: boolean
        default: false
  schedule:
    - cron: '37 1 * * 1'
permissions:
  contents: read
concurrency:
  group: daily-literature-delivery
  cancel-in-progress: false
jobs:
  calculate-and-send:
    if: vars.DELIVERY_ENABLED == 'true' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      HF_HOME: /home/runner/.cache/huggingface
      CUDA_VISIBLE_DEVICES: ''
      ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
      ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
      SENDER: ${{ secrets.SENDER }}
      RECEIVER: ${{ secrets.RECEIVER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Apply non-sensitive configuration override
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: uv run --frozen scripts/apply_config_override.py
      - name: Check required credentials
        run: uv run --frozen scripts/preflight.py
      - name: Beijing delivery date
        id: date
        run: echo "day=$(date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore successful delivery marker
        id: delivered
        uses: actions/cache/restore@v4
        with:
          path: .delivery
          key: literature-delivered-${{ github.repository_id }}-${{ steps.date.outputs.day }}
      - name: Cache Hugging Face model
        if: inputs.dry_run || steps.delivered.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: hf-jina-v5-nano-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Restore per-paper processing progress
        if: inputs.dry_run || steps.delivered.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .paper-progress
          key: paper-progress-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paper-progress-v1-${{ github.repository_id }}-
      - name: Generate and send brief
        id: process
        if: inputs.dry_run || steps.delivered.outputs.cache-hit != 'true'
        env:
          DELIVERY_MARKER: .delivery/sent
        run: uv run --frozen src/zotero_arxiv_daily/main.py executor.dry_run=${{ inputs.dry_run && 'true' || 'false' }}
      - name: Save per-paper progress including failed runs
        if: always() && (steps.process.outcome == 'success' || steps.process.outcome == 'failure') && hashFiles('.paper-progress/**/*.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .paper-progress
          key: paper-progress-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remember SMTP acceptance
        if: always() && !inputs.dry_run && steps.delivered.outputs.cache-hit != 'true' && hashFiles('.delivery/sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .delivery
          key: literature-delivered-${{ github.repository_id }}-${{ steps.date.outputs.day }}
      - name: Brief run summary
        if: always()
        run: uv run --frozen scripts/report_brief.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload brief verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-brief-report
          path: verification/brief/
          if-no-files-found: ignore
          retention-days: 14
